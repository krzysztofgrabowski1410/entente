  # -- winter -------------------------------------------------------------------------

  - id: BATC-L2.S.30
    title: a winter Disband naming a special is invalid, bare or designated
    # The specials need no supply centres and are never removed. MORGOTH owes
    # one removal (Anfauglith feeds one of his two plain armies); both
    # Disbands naming the Morgoth unit fail, and civil disorder takes the
    # army farthest from his centres.
    start:
      phase: F25M
      units:
        MORGOTH: ["3A ANF", "A ANF", "A HIT"]
      ownership:
        ANG: null
    script:
      - phase: F25M
      - phase: W25A
        orders:
          MORGOTH: ["Disband 3A ANF", "Disband 3A(M) ANF"]
    expect:
      resolutions:
        "Disband 3A ANF": fails
        "Disband 3A(M) ANF": fails
      specials:
        morgoth-unit: {province: ANF, limbo: false}
      units:
        MORGOTH: ["3A ANF", "A ANF"]

  # -- a reference to the other special is a reference to another order ----------

  - id: BATC-L2.S.31
    title: a support naming the other special supports nothing — the attack on 3A(M) is alone
    # "3A(M) fits only Morgoth and 3A(G) only Glaurung." The double attacks the
    # Morgoth unit; its two supporters write supports for a Dislodge of
    # Glaurung, an order nobody gave, so each matches nothing and Holds. The
    # attack meets 3 with 2 and fails, and both specials stand.
    start:
      phase: S25M
      units:
        MORGOTH: ["3A ANF", "3A ANF"]
        DORIATH: ["2A LOT", "A LAD", "A EIT"]
      l2:
        glaurung: ANF
    script:
      - phase: S25M
        orders:
          DORIATH:
            - "2A LOT DIS MORGOTH 3A(M) ANF"
            - "A LAD S DORIATH 2A LOT DIS MORGOTH 3A(G) ANF"
            - "A EIT S DORIATH 2A LOT DIS MORGOTH 3A(G) ANF"
    expect:
      resolutions:
        "2A LOT DIS MORGOTH 3A(M) ANF": fails
        "A LAD S DORIATH 2A LOT DIS MORGOTH 3A(G) ANF": fails
      specials:
        glaurung: {province: ANF, limbo: false}
        morgoth-unit: {province: ANF, limbo: false}
      units:
        MORGOTH: ["3A ANF", "3A ANF"]

