  - id: BATC-L2.S.26
    title: a support-move naming a bare 3A is invalid — the special bounces on the tie
    # DORIATH's double in Dor-nu-Fauglith defends at 2 + 1. MEN's `A LAD S
    # MORGOTH 3A ANF - DNN` names no unit and Holds, so the special attacks
    # at 3 against 3 and fails.
    start:
      phase: S25M
      units:
        MORGOTH: ["3A ANF"]
        MEN: ["A LAD"]
        DORIATH: ["2A DNN", "A RIV"]
    script:
      - phase: S25M
        orders:
          MEN: ["A LAD S MORGOTH 3A ANF - DNN"]
          MORGOTH: ["3A(M) ANF - DNN"]
          DORIATH: ["2A DNN H", "A RIV S DORIATH 2A DNN"]
    expect:
      resolutions:
        "A LAD S MORGOTH 3A ANF - DNN": fails
        "3A(M) ANF - DNN": fails
      units:
        MORGOTH: ["3A ANF"]
        DORIATH: ["2A DNN", "A RIV"]

