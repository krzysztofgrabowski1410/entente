  - id: BATC-L2.S.33
    title: a support naming Glaurung's Move matches nothing when the Morgoth unit made it
    # "3A(M) fits only Morgoth and 3A(G) only Glaurung." Both specials stand
    # in Anfauglith; the Morgoth unit moves on Eithel Sirion and Glaurung
    # holds. The support from Northern Ered Wethrim names a Move of Glaurung,
    # an order nobody gave, so it matches nothing: it is invalid and fails
    # ("... and otherwise the Unit holds"), and the Morgoth
    # unit meets Doriath's 3A with 3 against 3 and bounces.
    start:
      phase: S25M
      units:
        MORGOTH: ["3A ANF", "3A ANF", "A NEW"]
        DORIATH: ["3A EIT"]
      l2:
        glaurung: ANF
    script:
      - phase: S25M
        orders:
          MORGOTH:
            - "3A(M) ANF - EIT"
            - "3A(G) ANF H"
            - "A NEW S MORGOTH 3A(G) ANF - EIT"
          DORIATH: ["3A EIT H"]
    expect:
      resolutions:
        "3A(M) ANF - EIT": fails
        "A NEW S MORGOTH 3A(G) ANF - EIT": fails
      specials:
        glaurung: {province: ANF, limbo: false}
        morgoth-unit: {province: ANF, limbo: false}
      units:
        MORGOTH: ["3A ANF", "3A ANF", "A NEW"]
        DORIATH: ["3A EIT"]

