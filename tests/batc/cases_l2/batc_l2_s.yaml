  # -- never twins: each special holds under its own designator ---------------------

  - id: BATC-L2.S.28
    title: two unordered specials share no wall — the support-hold on 3A(M) leaves Glaurung bare
    # "Morgoth and Glaurung are therefore never twins." Neither special is
    # ordered; MEN's support-hold names 3A(M). Under the twins' wall the
    # support would defend both; it defends the Morgoth unit alone, and the
    # strength-4 Dislodge of 3A(G) meets Glaurung's bare 3 and succeeds.
    start:
      phase: S25M
      units:
        MORGOTH: ["3A ANF", "3A ANF"]
        MEN: ["A LOT"]
        DORIATH: ["A FSE", "A EIT", "A LAD", "A DNN"]
      l2:
        glaurung: ANF
    script:
      - phase: S25M
        orders:
          MEN: ["A LOT S MORGOTH 3A(M) ANF"]
          DORIATH:
            - "A FSE DIS MORGOTH 3A(G) ANF"
            - "A EIT S DORIATH A FSE DIS MORGOTH 3A(G) ANF"
            - "A LAD S DORIATH A FSE DIS MORGOTH 3A(G) ANF"
            - "A DNN S DORIATH A FSE DIS MORGOTH 3A(G) ANF"
    expect:
      resolutions:
        "A LOT S MORGOTH 3A(M) ANF": succeeds
        "A FSE DIS MORGOTH 3A(G) ANF": succeeds
      specials:
        glaurung: {province: ANF, limbo: true}
        morgoth-unit: {province: ANF, limbo: false}
      units:
        MORGOTH: ["3A ANF"]

