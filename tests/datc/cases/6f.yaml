# DATC section 6.F — Convoys.
# Hand-encoded from the DATC v3.3 document (docs/references/, git-ignored).
# The choices this suite certifies: 4.A.1-b (disruption needs
# ALL routes broken), 4.A.2-f (Szykman: paradox-implicated convoyed moves
# fail and deliver no cut; fleets treated as holding), 4.A.3 written-form
# (unflagged adjacent moves are overland; no land/convoy fallback either
# way), 4.A.4-a (cut exception covers convoyed attacks from the
# directed-against province), 4.A.7-b (prevent-nulling spares convoyed
# dislodgers). Convoy orders are asserted with the route-used
# semantics: succeeds iff the fleet is safe and lies on a viable used chain
# (a bounced-but-viable cargo still uses its route);
# a szykmaned cargo chose no route, so its fleets' convoy orders fail.
# 6.F.7's retreat half (Holland not contested) is encoded in 6.H.
section: 6.F Convoys
ruleset: standard
cases:
  - id: 6.F.1
    title: no convoy in coastal provinces
    phase: S1901M
    units:
      TURKEY: [A GRE, F AEG, F CON, F BLA]
    orders:
      TURKEY:
        - A GRE - SEV
        - F AEG C A GRE - SEV
        - F CON C A GRE - SEV
        - F BLA C A GRE - SEV
    expect:
      resolutions:
        A GRE - SEV: fails
        F AEG C A GRE - SEV: fails
        F CON C A GRE - SEV: fails
        F BLA C A GRE - SEV: fails

  - id: 6.F.2
