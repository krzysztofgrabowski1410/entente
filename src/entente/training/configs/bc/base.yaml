# Base config: the 20k-game subset run. d_model 192 / 6 layers sits at the low end
# of the 192-256 range because the ~36k order vocabulary dominates the parameter
# budget (the tied head keeps the whole model under 10M). Runs on WSL2 + CUDA,
# where bf16 autocast engages automatically; see docs/setup.md.
model:
  d_model: 192
  n_layers: 6
  n_heads: 8
  ff_mult: 4
  dropout: 0.1
  independent_heads: false
optim:
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 20000
  batch_size: 512
  grad_clip: 1.0
  value_loss_weight: 0.5
data:
  shards_dir: data/processed
  val_fraction: 0.05
  num_workers: 4
  shuffle: true
seed: 0
# out_dir/run_name yield checkpoints/bc/bc.pt -- the exact path the committed piKL
# configs (configs/pikl/*.yaml) and docs point at as the sweep anchor.
out_dir: checkpoints/bc
run_name: bc
device: auto
log_every: 50
eval_every: 500
